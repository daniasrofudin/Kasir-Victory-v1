<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFCF7">
<meta name="mobile-web-app-capable" content="yes">
<title>Kasir Lekker Victory</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --coklat:#1F1A17; --coklat2:#5E5047; --mentega:#FFB648; --krem:#FFFCF7; --krem2:#F5EEE4;
  --teks:#1F1A17; --abu:#9A8A7A; --garis:#EEE3D3; --hijau:#1E9E62; --merah:#D64545; --oranye:#E8912D; --sel:#FFF1DC;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--krem);color:var(--teks);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
header{position:sticky;top:0;z-index:20;background:var(--krem);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
header .logo{width:38px;height:38px;flex:none}
header .logo svg{width:38px;height:38px;display:block}
header .brand{flex:1;min-width:0}
header .brand small{display:block;color:var(--abu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .brand b{display:block;font-size:18px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--garis);display:flex;align-items:center;justify-content:center;flex:none}
.pill{font-size:12px;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--garis);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--abu);display:inline-block}
.pill.ok i{background:#34C27A}.pill.antre i{background:var(--oranye)}.pill.off{color:var(--merah)}.pill.off i{background:var(--merah)}.pill.demo i{background:#B9AC9F}
.latihan{background:var(--mentega);color:var(--teks);text-align:center;font-weight:700;font-size:13px;padding:5px}
main{padding:6px 14px 180px;max-width:720px;margin:0 auto}
.card{background:#fff;border:1px solid var(--garis);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--teks);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 span{font-weight:500;color:var(--abu);font-size:12.5px;text-align:right}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.ch b{font-size:15px}.ch span{font-size:12.5px;color:var(--abu)}
.omzet{background:var(--sel);border-radius:var(--r);padding:12px 12px 12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.omzet small{display:block;font-size:12px;color:#9A6A2A}
.omzet b{display:block;font-size:20px;letter-spacing:.5px}
.eye{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.seg{display:flex;background:var(--krem2);border-radius:999px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px 6px;border-radius:999px;font-weight:600;font-size:14px;color:var(--coklat2)}
.seg button.on{background:#fff;color:var(--teks);box-shadow:0 1px 3px rgba(60,40,20,.12)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tp{position:relative;min-height:74px;border-radius:18px;border:2px solid transparent;font-weight:600;font-size:13.5px;padding:10px 2px 8px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:6px}
.tp .dot{width:28px;height:28px;border-radius:50%;display:block}
.tp:active{transform:scale(.96)}
.tp.sel{border-color:var(--teks)}
.tp .badge{position:absolute;top:4px;right:5px;background:var(--teks);color:#fff;border-radius:999px;font-size:11.5px;min-width:19px;line-height:19px;padding:0 4px;font-weight:700}
.tp small{font-size:10.5px;color:var(--oranye);font-weight:700}
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;margin-bottom:10px;align-items:center}
.slot{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:13.5px;font-weight:600}
.slot i{width:12px;height:12px;border-radius:50%;display:inline-block}
.slot em{font-style:normal;color:var(--abu);margin-left:2px}
.racikbox{margin-top:12px;border:1px solid var(--garis);border-radius:18px;padding:12px}
.racikbox small{display:block}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.fchip{flex:none;background:#fff;border:1px solid var(--garis);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;white-space:nowrap}
.fchip small{color:var(--abu);font-weight:500;margin-left:4px}
.sec{font-size:13px;font-weight:700;color:var(--coklat2);margin:4px 2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--teks);color:#fff;border-radius:999px;padding:6px 10px 6px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip i{font-style:normal;opacity:.75;font-size:13px}
.hint{color:var(--abu);font-size:13.5px;margin:4px 0}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.harga{font-weight:700;font-size:15px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:50%;background:var(--krem2);font-size:20px;font-weight:700;color:var(--teks)}
.step button:last-child{background:var(--teks);color:#fff}
.step span{min-width:28px;text-align:center;font-weight:700;font-size:17px}
.mini{padding:8px 12px;border-radius:999px;background:var(--krem2);font-weight:600;font-size:13.5px;color:var(--coklat2)}
.btn{display:block;width:100%;padding:14px;border-radius:999px;background:var(--teks);color:#fff;font-weight:700;font-size:16px;text-align:center}
.btn:disabled{opacity:.35}
.btn.alt{background:var(--krem2);color:var(--teks)}
.btn.kuning{background:var(--mentega);color:var(--teks)}
.btn.merah{background:var(--merah)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.qb{flex:1 1 calc(50% - 8px);min-height:54px;text-align:left;padding:10px 14px;border-radius:18px;background:#fff;border:1px solid var(--garis)}
.qb b{display:block;font-size:14.5px}.qb small{color:var(--abu);font-size:12.5px}
.qb:disabled{opacity:.4}
.cartbar{position:fixed;left:0;right:0;bottom:66px;z-index:25;padding:0 14px 8px}
.cartbar .in{max-width:692px;margin:0 auto;background:var(--teks);color:#fff;border-radius:999px;display:flex;align-items:center;padding:6px 6px 6px 20px;gap:10px;box-shadow:0 8px 24px rgba(31,26,23,.28)}
.cartbar .info{flex:1;font-size:12.5px;color:#C9BBAA}.cartbar .info b{display:block;font-size:18px;color:#fff}
.cartbar .bayar{background:var(--mentega);color:var(--teks);font-weight:800;padding:13px 22px;border-radius:999px;font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:26;background:#fff;border-top:1px solid var(--garis);display:flex;padding:4px 0 env(safe-area-inset-bottom)}
nav button{flex:1;padding:7px 2px 8px;font-size:11.5px;color:#B0A08F;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--teks)}
.sheet-bg{position:fixed;inset:0;background:rgba(31,26,23,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:19px}
.line{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--krem2)}
.line .nm{flex:1;min-width:0}.line .nm b{display:block;font-size:15px}.line .nm small{color:var(--abu);font-size:13px}
.x{width:36px;height:36px;border-radius:50%;background:#FBE4E1;color:var(--merah);font-weight:800}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:12px 0}
.big{font-size:34px;font-weight:800;text-align:center;margin:6px 0}
label.f{display:block;font-size:13px;color:var(--abu);margin:12px 0 5px;font-weight:600}
.inp{width:100%;padding:13px 14px;border:1.5px solid var(--garis);border-radius:16px;background:var(--krem);font-size:16px}
.inp:focus{outline:none;border-color:var(--teks)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--krem2);font-size:15px;gap:10px}
.kv b{font-weight:700;text-align:right}
.muted{color:var(--abu);font-size:13px}
.tag{font-size:11.5px;padding:3px 8px;border-radius:999px;font-weight:700;background:var(--krem2);color:var(--coklat2)}
.tag.batal{background:#FBE4E1;color:var(--merah)}.tag.lat{background:#FFF1C2;color:#7a5a00}.tag.ok{background:#E2F2E8;color:var(--hijau)}
.bar{height:8px;background:var(--krem2);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--mentega)}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--teks);color:#fff;padding:10px 18px;border-radius:999px;z-index:60;font-size:14.5px;font-weight:600;max-width:90vw;text-align:center}
.ok-ic{width:72px;height:72px;border-radius:50%;background:#E2F2E8;color:var(--hijau);font-size:40px;display:flex;align-items:center;justify-content:center;margin:6px auto}
.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--krem2);gap:10px}
.sw input{width:22px;height:22px;accent-color:var(--teks);flex:none}
.setup{max-width:480px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 16px 24px}
.setup h1{color:var(--teks);font-size:24px;margin:8px 0 4px}
.setup .logo svg{width:64px;height:64px;display:block;margin:6px 0}
.optbtn{display:block;width:100%;text-align:left;padding:14px;border-radius:18px;border:1.5px solid var(--garis);background:#fff;margin-bottom:10px}
.optbtn.on{border-color:var(--teks);background:var(--sel)}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
'use strict';
/* =================== DATA & PENYIMPANAN =================== */
var MEM = {};
function load(k, d){ try{ var v = localStorage.getItem('lv_'+k); return v==null ? (k in MEM ? MEM[k] : d) : JSON.parse(v); }catch(e){ return k in MEM ? MEM[k] : d; } }
function save(k, v){ MEM[k] = v; try{ localStorage.setItem('lv_'+k, JSON.stringify(v)); }catch(e){} }

var DEFAULT_CFG = {
  versi: 'bawaan',
  toppings: ['Coklat','Stroberi','Bluberi','Yupi','Pisang','Kacang','Keju','Oreo'].map(function(n){ return {nama:n, premium:false, aktif:true, takaran:0}; }),
  kanal: [
    {nama:'Offline', base:2500, extra:500, prem:500, tampil:true},
    {nama:'GrabFood', base:3500, extra:500, prem:500, tampil:true},
    {nama:'Online (WA/IG/TikTok)', base:2500, extra:500, prem:500, tampil:true}
  ],
  favorit: [
    {nama:'Keju Coklat', toppings:['Keju','Coklat'], aktif:true},
    {nama:'Coklat Pisang', toppings:['Coklat','Pisang'], aktif:true},
    {nama:'Pisang Coklat Keju', toppings:['Pisang','Coklat','Keju'], aktif:true},
    {nama:'Kacang Keju Coklat', toppings:['Kacang','Keju','Coklat'], aktif:true}
  ],
  paket: [],
  kasir: ['Dani','Agung'],
  karyawan: [{nama:'Dani', pin:'', peran:'Pemilik', aktif:true}, {nama:'Agung', pin:'', peran:'Pemilik', aktif:true}],
  jadwal: [{nama:'Shift 1', mulai:'10:00', selesai:'16:00'}, {nama:'Shift 2', mulai:'15:30', selesai:'21:30'}],
  kategori: ['Bahan baku (tepung, telur, susu, mentega)','Topping & isian','Kemasan (mika, plastik, kertas)','Gas & bahan bakar','Listrik & air',
    'Transportasi & ongkir','Perawatan & perbaikan alat','Kebersihan & perlengkapan kecil','Pulsa, internet & aplikasi','Lain-lain'],
  outlet: ['Plosokandang','Kepatihan'],
  maxTopping: 5,
  pin: '1234',
  batasKeluar: 50000,
  toleransi: 10,
  member: {perRp:1000, poinTukar:100, nilaiTukar:10000, kanal:['Offline','Online (WA/IG/TikTok)']},
  members: [],
  biaya: {base:668, kresekHarga:200, kresekPcs:6, top:{}, paket:{}},
  bahan: [],
  bahanInfo: []
};
var APP_VERSI = '3.2';
var CFG_KEYS = ['karyawan','jadwal','kategori','batasKeluar','toleransi','member','members','biaya','bahan','bahanInfo'];

var cfg = load('cfg', DEFAULT_CFG);
var S = load('settings', {url:'', key:'', outlet:'', device:'', latihan:false, printer:false, autoPrint:false, setupDone:false});
if(!S.device){ S.device = Math.random().toString(36).slice(2,6).toUpperCase(); save('settings', S); }
var shift = load('shift', null);
var queue = load('queue', []);
var txLog = load('txlog', []);
var kasLog = load('kaslog', []);
var shiftHist = load('shifthist', []);
CFG_KEYS.forEach(function(k){ if(cfg[k]===undefined) cfg[k] = DEFAULT_CFG[k]; });
var localMembers = load('localmembers', []);
var arrivals = load('arrivals', []);
var mbaruLog = load('mbarulog', []);

var ui = {own:{open:false, tab:'dash', period:'hari', data:load('owndata',null), loading:false, err:''}, lastWa:load('lastwa',''), tab:'kasir', kanal:null, racik:[], qty:1, cart:[], syncState:'', lastSync:null, rekap:'hari', handover:load('handover', null), modal:null};

/* =================== UTIL =================== */
function rp(n){ n = Math.round(Number(n)||0); return 'Rp' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function num(n){ return (Math.round(Number(n)||0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function digits(s){ return Number(String(s||'').replace(/\D/g,'')) || 0; }
function pad(n){ return (n<10?'0':'')+n; }
function dKey(d){ d = new Date(d); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function jam(d){ d = new Date(d); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function tglTampil(d){ d = new Date(d); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function $(id){ return document.getElementById(id); }
var toastTimer;
function toast(msg){ var t = $('toastEl'); if(!t){ t = document.createElement('div'); t.id='toastEl'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.add('hidden'); }, 1600); }

function activeToppings(){ return cfg.toppings.filter(function(t){ return t.aktif; }); }
function topInfo(n){ for(var i=0;i<cfg.toppings.length;i++) if(cfg.toppings[i].nama===n) return cfg.toppings[i]; return null; }
function kanalList(){ return cfg.kanal.filter(function(k){ return k.tampil; }); }
function kanalInfo(n){ for(var i=0;i<cfg.kanal.length;i++) if(cfg.kanal[i].nama===n) return cfg.kanal[i]; return cfg.kanal[0]; }
function isGrab(k){ return /grab/i.test(k||''); }

/* Logo & ikon */
var LOGO = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#2B1A10"/><path d="M10 44a22 22 0 0 1 44 0z" fill="#F2A93B"/><circle cx="22" cy="37" r="3" fill="#C9781E"/><circle cx="32" cy="31" r="2.5" fill="#C9781E"/><circle cx="42" cy="38" r="3" fill="#C9781E"/><path d="M22 18l4 5 6-8 6 8 4-5v6H22z" fill="#E8CFA8"/></svg>';
var ICONS = {
  kasir:'<rect x="3" y="11" width="18" height="9" rx="2"/><path d="M7 11V5h10v6M10 8h4M7 15h2M11 15h2M15 15h2"/>',
  riwayat:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  member:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.3 0 4 2 4 5"/>',
  rekap:'<path d="M4 20h16"/><rect x="5" y="11" width="3" height="7" rx="1"/><rect x="10.5" y="6" width="3" height="12" rx="1"/><rect x="16" y="13" width="3" height="5" rx="1"/>',
  shift:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  atur:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
  box:'<path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/>',
  cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/><path d="M3 4h2l2.4 11h11l2-8H6.3"/>',
  dash:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="4.5" rx="1.5"/><rect x="13.5" y="11" width="7" height="9.5" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 6A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-3 3.6M6.4 6.9C3.9 8.6 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.2-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'
};
function ic(n){ return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||'')+'</svg>'; }
var WARNA = [['coklat','#7A4A2E','#F3E6DD'],['keju','#E9B824','#FFF6D6'],['pisang','#D9B73A','#FFF8DC'],['kacang','#B9773A','#F8ECDD'],['oreo','#2E2E2E','#ECECEC'],
  ['blu','#4E5FCC','#E8EBFB'],['stro','#D9486A','#FCE6EC'],['yupi','#8B4FD6','#F1E7FC'],['matcha','#5E9E3A','#E9F4E1'],['tiram','#8C6A4F','#F2EAE2'],['green','#5E9E3A','#E9F4E1'],['mesis','#7A4A2E','#F3E6DD']];
var WARNA_LAIN = [['#2A9D8F','#E0F3F1'],['#E76F51','#FCE9E3'],['#457B9D','#E3EEF5'],['#B5838D','#F5ECEE'],['#6D597A','#EEE9F1']];
function topColor(n){ var k = String(n||'').toLowerCase();
  for(var i=0;i<WARNA.length;i++) if(k.indexOf(WARNA[i][0])>=0) return {c:WARNA[i][1], bg:WARNA[i][2]};
  var h = 0; for(var j=0;j<k.length;j++) h = (h*31 + k.charCodeAt(j)) % 9973; var w = WARNA_LAIN[h % WARNA_LAIN.length]; return {c:w[0], bg:w[1]}; }

/* Paket outlet: isi racikan, mis. "Keju+Coklat, Coklat+Pisang x2" */
function parseIsi(txt){
  var out = [];
  String(txt||'').split(',').forEach(function(part){
    part = part.trim(); if(!part) return;
    var m = part.match(/^(.*?)(?:\s*[x×]\s*(\d+))?$/i), n = (m && m[2]) ? Number(m[2]) : 1;
    var tops = (m ? m[1] : part).split('+').map(function(x){ var nm = x.trim().toLowerCase();
      var t = cfg.toppings.filter(function(tt){ return tt.nama.toLowerCase()===nm; })[0]; return t ? t.nama : null; });
    if(!tops.length || tops.some(function(x){ return !x; })) return;
    out.push({toppings:tops, n:n});
  });
  return out;
}

function hppLocal(items){

    if(it.jenis==='Paket'){ pcsR += it.pcs; h += it.pcs*base; (it.toppings||[]).forEach(function(x){ h += ((b.top||{})[x.nama]||0) * x.jumlah; }); return; }
    pcsR += it.pcs; h += it.qty*base; (it.toppings||[]).forEach(function(x){ h += ((b.top||{})[x.nama]||0) * x.jumlah; });
  });
  if(pcsR) h += Math.ceil(pcsR/(b.kresekPcs||6)) * (b.kresekHarga||0);
  return Math.round(h);
}

function ulangTahunMinggu(){
  var now = new Date(), t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()), out = [];
  allMembers().forEach(function(m){
    var p = String(m.lahir||'').split('-'); if(p.length<2) return;

    var diff = Math.round((d - t0)/86400000); if(diff>=0 && diff<=7) out.push({m:m, d:diff});
  });
  return out.sort(function(a,b){ return a.d-b.d; });
}

  var j = cfg.jadwal||[]; if(!j.length) return null;

function bukaShift(){

  shift = {id: arr ? arr.id : 'SHF-'+S.device+'-'+Date.now().toString(36).toUpperCase(), kasir:orang.nama, modal:modal||0, buka:now.toISOString(),

  else queue.push({type:'absen', uid:'AB-'+shift.id, id:shift.id, outlet:S.outlet, nama:shift.kasir, shiftNama:shift.shiftNama, jadwalMulai:shift.jadwalMulai,

function hariIni(t){ return dKey(t)===dKey(new Date()); }
function laporanHarian(rec){
  var now = new Date(), lat = !!S.latihan, okStatus = lat ? 'Latihan' : 'OK';
  var tx = txLog.filter(function(t){ return hariIni(t.time) && t.outlet===S.outlet && t.status===okStatus; });
  var r = {omzet:0, offline:0, grab:0, online:0, tunai:0, qris:0, pcs:0, n:tx.length, hpp:0, mtx:0}, combo = {};
  tx.forEach(function(t){ r.omzet += t.total; r.pcs += t.pcs; r.hpp += (t.hppEst!=null ? t.hppEst : hppLocal(t.items)); if(t.member) r.mtx++;
    if(t.kanal==='Offline') r.offline += t.total; else if(isGrab(t.kanal)) r.grab += t.total; else r.online += t.total;
    if(t.bayar==='Tunai') r.tunai += t.total; else if(t.bayar==='QRIS') r.qris += t.total;
    t.items.forEach(function(i){ if(i.jenis!=='Paket' && i.jenis!=='Potongan') combo[i.nama] = (combo[i.nama]||0) + i.qty; }); });
  var kas = kasLog.filter(function(k){ return hariIni(k.time) && k.outlet===S.outlet && k.status===okStatus; });
  var keluar = 0, setor = 0, rincian = [];

  var sh = shiftHist.filter(function(x){ return hariIni(x.tutup) && x.outlet===S.outlet && !!x.latihan===lat; }).reverse();
  var selisih = 0; sh.forEach(function(x){ selisih += x.selisih; });
  var shiftText = sh.map(function(x){ return x.kasir+(x.shiftNama?' ('+x.shiftNama+')':'')+' '+jam(x.buka)+'–'+jam(x.tutup)+(x.telat?', telat '+x.telat+' mnt':'')+(x.selisih?', selisih '+rp(x.selisih):''); }).join('; ');
  var habis = [], menipis = [];
  activeToppings().forEach(function(t){ var st = stokState[t.nama]||'Cukup'; if(st==='Habis') habis.push(t.nama); else if(st==='Menipis') menipis.push(t.nama); });
  var top = Object.keys(combo).sort(function(a,b){ return combo[b]-combo[a]; }).slice(0,3).map(function(k){ return k+' ('+combo[k]+')'; });
  var catatan = (ui.hcat||'').trim();

  var L = [];

  L.push('');
  L.push('💰 *Omzet: '+rp(r.omzet)+'*');
  L.push('   '+num(r.pcs)+' pcs · '+r.n+' transaksi');
  L.push('   Offline '+rp(r.offline)+' · Grab '+rp(r.grab)+(r.online?' · Online '+rp(r.online):''));
  L.push('   Tunai '+rp(r.tunai)+' · QRIS '+rp(r.qris));
  L.push('');
  L.push('🧾 Pengeluaran laci: '+rp(keluar)+(rincian.length?' ('+rincian.join('; ')+')':''));
  if(setor) L.push('💵 Setoran ke pemilik: '+rp(setor));
  L.push('🔐 Kas: uang di laci '+rp(rec.dihitung)+' · selisih hari ini '+(selisih===0?'Rp0 ✓':rp(selisih)));
  L.push('');
  L.push('👥 Shift: '+(shiftText||'-'));
  var mbaru = mbaruLog.filter(function(x){ return x.outlet===S.outlet && hariIni(x.time); }).length;
  L.push('👤 Member: '+r.mtx+' transaksi · '+mbaru+' member baru');
  if(top.length) L.push('🔥 Terlaris: '+top.join(', '));
  L.push('📦 Perlu belanja: '+(habis.length||menipis.length ? (habis.length?'HABIS: '+habis.join(', '):'')+(habis.length&&menipis.length?' · ':'')+(menipis.length?'menipis: '+menipis.join(', '):'') : 'aman'));
  if(catatan) L.push('📝 Catatan: '+catatan);
  var id = 'HR-'+S.device+'-'+Date.now().toString(36).toUpperCase();
  return {text: L.join('\n'), rec: {type:'harian', uid:id, id:id, time:now.toISOString(), outlet:S.outlet, kasir:rec.kasir, omzet:r.omzet, offline:r.offline, grab:r.grab,
    online:r.online, tunai:r.tunai, qris:r.qris, pcs:r.pcs, transaksi:r.n, keluar:keluar, setor:setor, selisih:selisih, shiftText:shiftText,
    habis:habis.join(', '), menipis:menipis.join(', '), terlaris:top.join(', '), catatan:catatan, status:okStatus,
    hpp:r.hpp, laba:r.omzet - r.hpp, memberTrx:r.mtx, memberBaru:mbaru}};

    var v = angkaDes(inp.value); if(v===null) return; if(isNaN(v) || v<0){ bad = true; return; }
    var id = 'HIT-'+S.device+'-'+Date.now().toString(36).toUpperCase()+'-'+recs.length;
    recs.push({type:'hitung', uid:id, id:id, time:new Date().toISOString(), tanggal:tgl, bahan:inp.getAttribute('data-l'), jumlah:v, oleh:oleh, lokasi:hs.lokasi});
  });
  if(bad){ toast('Ada angka yang salah. Desimal pakai koma, mis. 0,25'); return; }
  if(!recs.length){ toast('Belum ada angka yang diisi'); return; }
  queue = queue.concat(recs); save('queue', queue); closeSheet();
  toast(recs.length+' bahan di '+hs.lokasi+' tersimpan'); syncNow(); setTimeout(fetchOwner, 5000);
}
/* Kiriman gudang -> outlet */
function openKiriman(dariPemilik){
  var k = ui.kir || (ui.kir = {lines:3});
  k.pemilik = !!dariPemilik; if(!k.ke) k.ke = S.outlet;
  var opts = '<option value="">— pilih bahan —</option>'+bahanInfo().map(function(b){ return '<option>'+esc(b.label)+'</option>'; }).join('');
  var h = '<div class="sheet"><h2>'+(k.pemilik?'Catat kiriman ke outlet':'Terima kiriman dari gudang')+'</h2>';
  if(k.pemilik) h += '<label class="f">Dikirim ke</label><div class="seg" style="margin:0">'+cfg.outlet.map(function(o){ return '<button data-a="kirke" data-v="'+esc(o)+'" class="'+(k.ke===o?'on':'')+'">'+esc(o)+'</button>'; }).join('')+'</div>';
  else h += '<p class="muted">Outlet: <b>'+esc(S.outlet)+'</b> · dicatat '+esc(shift?shift.kasir:'')+'</p>';
  h += '<p class="muted" style="margin-top:10px">Jumlah dalam satuan di dalam kurung (desimal pakai koma). Contoh: keju 500 g = 0,5.</p>';
  for(var i=0;i<k.lines;i++) h += '<div class="row" style="margin-top:8px"><select class="inp" id="kb'+i+'" style="flex:2">'+opts+'</select><input class="inp" id="kj'+i+'" inputmode="decimal" placeholder="jumlah" style="flex:1"></div>';
  h += '<button class="mini" data-a="kirbaris" style="margin-top:10px">＋ Tambah baris</button>';
  if(k.pemilik) h += '<label class="f">Dicatat oleh</label><select class="inp" id="kOleh">'+pemilikList().map(function(n){ return '<option>'+esc(n)+'</option>'; }).join('')+'</select>';
  h += '<button class="btn" data-a="kirok" style="margin-top:14px">Simpan kiriman</button><button class="btn alt" data-a="close" style="margin-top:8px">Batal</button></div>';
  sheet(h);
}
function kirimanOk(){
  var k = ui.kir, recs = [], bad = false, ke = k.pemilik ? k.ke : S.outlet, oleh = k.pemilik ? ($('kOleh')||{}).value : (shift?shift.kasir:'');
  for(var i=0;i<k.lines;i++){
    var b = ($('kb'+i)||{}).value, j = angkaDes(($('kj'+i)||{}).value);
    if(!b && j===null) continue;
    if(!b || j===null || isNaN(j) || j<=0){ bad = true; continue; }
    var id = 'KRM-'+S.device+'-'+Date.now().toString(36).toUpperCase()+'-'+i;
    recs.push({type:'kiriman', uid:id, id:id, time:new Date().toISOString(), tanggal:tglKey(0), ke:ke, bahan:b, jumlah:j, oleh:oleh, status:(!k.pemilik && S.latihan)?'Latihan':'OK'});
  }
  if(bad){ toast('Lengkapi bahan dan jumlahnya (desimal pakai koma)'); return; }
  if(!recs.length){ toast('Belum ada bahan yang diisi'); return; }
  queue = queue.concat(recs); save('queue', queue); k.lines = 3; closeSheet();
  toast('Kiriman ke '+ke+' tercatat ('+recs.length+' bahan)'); render(); syncNow();
}

/* =================== PIN & SHEET =================== */
function sheet(html){ $('layer').innerHTML = '<div class="sheet-bg" id="sbg">'+html+'</div>'; }
function closeSheet(){ $('layer').innerHTML = ''; pinCb = null; }
var pinCb = null, pinCancel = null, pinPending = false;
function askPin(title, ok, cancel){
  pinCb = ok; pinCancel = cancel || null;
  sheet('<div class="sheet"><h2>'+esc(title)+'</h2><label class="f">PIN pemilik</label><input class="inp" id="pin" type="password" inputmode="numeric" autocomplete="off">'+
    '<button class="btn" data-a="pinok" style="margin-top:12px">OK</button><button class="btn alt" data-a="pincancel" style="margin-top:8px">Batal</button></div>');
  setTimeout(function(){ var p = $('pin'); if(p){ p.focus(); p.addEventListener('keydown', function(e){ if(e.key==='Enter') pinOk(); }); } }, 50);
}
function pinOk(){ var p = $('pin'), v = String(p.value).trim();
  if(v === String(cfg.pin||'1234').trim()){ var f = pinCb; closeSheet(); f && f(); return; }
  if(S.url && !pinOk.retried){ pinOk.retried = true; toast('Mengecek PIN terbaru…');
    fetchConfig(function(){ pinOk.retried = false; var q = $('pin'); if(!q) return;
      if(v === String(cfg.pin||'').trim()){ var f2 = pinCb; closeSheet(); f2 && f2(); } else { q.value=''; toast('PIN salah'); } }); return; }
  p.value=''; toast('PIN salah'); }

/* =================== STRUK (RawBT) =================== */
function struk(t){
  var W = 32, L = function(a,b){ a = String(a); b = String(b); var sp = W - a.length - b.length; return sp>0 ? a + Array(sp+1).join(' ') + b : a+'\n'+Array(W-b.length+1).join(' ')+b; };
  var C = function(s){ s = String(s); var p = Math.max(0, Math.floor((W - s.length)/2)); return Array(p+1).join(' ') + s; };
  var garis = Array(W+1).join('-');
  var s = [C('LEKKER VICTORY'), C(t.outlet), '', L(tglTampil(t.time)+' '+jam(t.time), t.kasir), L(t.kanal, t.id.slice(-11)), garis];
  t.items.forEach(function(i){ s.push(i.label||i.nama); if(i.label) s.push('  '+i.nama); s.push(L('  '+i.qty+' x '+num(i.harga), num(i.subtotal))); });
  s.push(garis); s.push(L('TOTAL', rp(t.total)));
  if(t.bayar==='Tunai'){ s.push(L('Tunai', rp(t.terima))); s.push(L('Kembali', rp(t.terima - t.total))); } else s.push(L('Bayar', t.bayar));
  if(t.member){ s.push(garis); s.push('Member: '+t.memberNama); s.push(L('Poin transaksi ini', '+'+(t.poinPlus||0)+(t.poinMinus?' -'+t.poinMinus:''))); if(t.saldoSesudah!=null) s.push(L('Saldo poin', num(t.saldoSesudah))); }
  if(t.status==='Batal') s.push(C('*** DIBATALKAN ***'));
  s.push(garis); s.push(C('Terima kasih!')); s.push(''); s.push(''); s.push('');
  return s.join('\n');
}
function printText(txt){
  var b64 = btoa(unescape(encodeURIComponent(txt)));
  window.location.href = 'intent:base64,' + b64 + '#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';
}
function printStruk(id){ var t = txById(id); if(t) printText(struk(t)); }

/* =================== SINKRON =================== */
var syncing = false;
function syncNow(){
  if(!S.url || syncing) { render(); return; }
  if(!queue.length){ ui.syncState = ''; render(); return; }
  syncing = true; ui.syncState = 'kirim'; render();
  var batch = queue.slice(0, 40);
  fetch(S.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({key:S.key, records:batch}), redirect:'follow'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.ok) throw new Error(j.error||'ditolak');
      var ok = {}; (j.saved||[]).forEach(function(u){ ok[u] = true; });
      queue = queue.filter(function(q){ return !ok[q.uid]; }); save('queue', queue);
      txLog.forEach(function(t){ if(ok[t.uid]) t.synced = true; }); save('txlog', txLog);
      ui.syncState = ''; ui.lastSync = new Date(); syncing = false; render();
      if(batch.some(function(q){ return q.type==='member' || (q.type==='tx' && q.member) || q.type==='void'; })) fetchConfig(function(){});
      if(queue.length) setTimeout(syncNow, 300);
    })
    .catch(function(e){ syncing = false; ui.syncState = 'gagal'; ui.syncErr = e.message; render(); });
}
setInterval(function(){ if(queue.length) syncNow(); }, 30000);
window.addEventListener('online', syncNow);

/* =================== EVENT =================== */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-a]');
  if(!el){ if(e.target.id==='sbg'){ var wasPin = !!pinCb, c = pinCancel; closeSheet(); if(wasPin && c) c(); } return; }
  var a = el.getAttribute('data-a'), v = el.getAttribute('data-v'), idx = Number(el.getAttribute('data-i'));
  switch(a){
    case 'tab': ui.tab = v; if(v!=='atur') aturOpen = false; closeSheet(); if(!shift && v==='atur'){ aturOpen = false; ui.forceAtur = true; } render(); break;
    case 'kanal': ui.kanal = v; render(); break;
    case 'top':
      if(ui.racik.length >= (cfg.maxTopping||5)){ toast('Maksimal '+(cfg.maxTopping||5)+' topping per pcs'); break; }
      ui.racik.push(v); render(); break;
    case 'untop': var ix = ui.racik.lastIndexOf(v); if(ix>=0) ui.racik.splice(ix,1); render(); break;
    case 'unslot': ui.racik.splice(idx,1); if(!ui.racik.length) ui.qty = 1; render(); break;
    case 'eye': ui.showOmzet = !ui.showOmzet; clearTimeout(ui.eyeT); if(ui.showOmzet) ui.eyeT = setTimeout(function(){ ui.showOmzet = false; if(ui.tab==='kasir' && shift) render(); }, 8000); render(); break;
    case 'mdaftar2': ui.mctx = 'tab'; openDaftarMember(); break;
    case 'ownopen': ui.own.open = true; ui.own.tab = 'dash'; aturOpen = false; ui.forceAtur = false; render(); fetchOwner(); break;
    case 'ownclose': ui.own.open = false; ui.tab = 'kasir'; render(); break;
    case 'ownrefresh': fetchOwner(); break;
    case 'owntab': ui.own.tab = v; render(); if(!ui.own.data) fetchOwner(); break;
    case 'ownper': ui.own.period = v; render(); break;
    case 'hitung': openHitung(); break;
    case 'hitlok': ui.hit.lokasi = v; openHitung(); break;
    case 'hitwkt': ui.hit.waktu = v; openHitung(); break;
    case 'hitok': hitungOk(); break;
    case 'kiriman': ui.kir = {lines:3}; openKiriman(false); break;
    case 'kirimanown': ui.kir = {lines:3}; openKiriman(true); break;
    case 'kirke': ui.kir.ke = v; openKiriman(true); break;
    case 'kirbaris': var keep = []; for(var q=0;q<ui.kir.lines;q++) keep.push([($('kb'+q)||{}).value, ($('kj'+q)||{}).value]); ui.kir.lines++; openKiriman(ui.kir.pemilik);
      keep.forEach(function(x, q){ var a=$('kb'+q), b2=$('kj'+q); if(a) a.value = x[0]; if(b2) b2.value = x[1]; }); break;
    case 'kirok': kirimanOk(); break;
    case 'bellok': ui.bel.lokasi = v; render(); break;
    case 'belmet': ui.bel.metode = v; render(); break;
    case 'belok': belanjaOk(); break;
    case 'qty': ui.qty = Math.max(1, ui.qty + Number(v)); render(); break;
    case 'setqty': ui.qty = Number(v); render(); break;
    case 'clearracik': ui.racik = []; ui.qty = 1; render(); break;
    case 'addracik': addToCart({jenis:'Racik', toppings:ui.racik.slice(), qty:ui.qty}); toast('+'+ui.qty+' '+comboName(ui.racik)); ui.racik = []; ui.qty = 1; render(); break;
    case 'fav': var f = cfg.favorit.filter(function(f){ return f.aktif && f.toppings.every(function(n){ var t=topInfo(n); return t && t.aktif; }); })[Number(v)];
      if(f){ addToCart({jenis:'Favorit', label:f.nama, toppings:f.toppings.slice(), qty:1}); toast('+1 '+f.nama); render(); } break;
    case 'paket': var p = cfg.paket[Number(v)]; if(p){ addToCart({jenis:'Paket', paket:p, qty:1}); toast('+1 '+p.nama); render(); } break;
    case 'cart': openCart(); break;
    case 'cq': ui.cart[idx].qty = Math.max(1, ui.cart[idx].qty + Number(v)); render(); openCart(); break;
    case 'cdel': ui.cart.splice(idx,1); render(); if(ui.cart.length) openCart(); else closeSheet(); break;
    case 'cclear': ui.cart = []; closeSheet(); render(); break;
    case 'pay': pay.terima = 0; openPay(); break;
    case 'member': openMember(); break;
    case 'mpilih': ui.member = v; pay.tukar = false; pay.catatan = ''; openPay(); break;
    case 'mlepas': ui.member = null; pay.tukar = false; pay.catatan = ''; openPay(); break;
    case 'mdaftar': ui.mctx = 'pay'; openDaftarMember(); break;
    case 'mdaftarok': daftarMemberOk(); break;
    case 'pilihoutlet': ui.outletPilih = v; render(); break;
    case 'absendatang': openAbsenDatang(); break;
    case 'adpilih': ui.adNama = v; openAbsenDatang(); break;
    case 'adshift': ui.adShift = v; openAbsenDatang(); break;
    case 'adok': absenDatangOk(); break;
    case 'kbahan': ui.kbahan = v; break;
    case 'metode': pay.metode = v; pay.catatan = ($('catatan')||{}).value||''; openPay(); break;
    case 'terima': pay.terima = Number(v); pay.catatan = ($('catatan')||{}).value||''; openPay(); break;
    case 'simpan': simpanTransaksi(); break;
    case 'close': closeSheet(); break;
    case 'print': printStruk(v); break;
    case 'testprint': printText('LEKKER VICTORY\nTes printer berhasil\n'+tglTampil(new Date())+' '+jam(new Date())+'\n\n\n'); break;
    case 'txd': openTxDetail(v); break;
    case 'void': doVoid(v); break;
    case 'voidok': voidOk(v); break;
    case 'rekap': ui.rekap = v; render(); break;
    case 'pilihkasir': ui.shiftKasir = v; ui.pinRetry = false; renderShiftOpen(); setTimeout(function(){ var p=$('pinMasuk'); if(p) p.focus(); }, 50); break;
    case 'pilihshift': ui.shiftPilih = v; render(); break;
    case 'modal': ui.modal = Number(v); renderShiftOpen(); break;
    case 'bukashift': bukaShift(); break;
    case 'keluar': openKas('Pengeluaran'); break;
    case 'setor': openKas('Setoran'); break;
    case 'kasok': kasOk(v); break;
    case 'serahterima': serahTerima(); break;
    case 'tutuptoko': openTutupToko(); break;
    case 'stok': var urut = ['Cukup','Menipis','Habis']; stokState[v] = urut[(urut.indexOf(stokState[v]||'Cukup')+1)%3]; renderTutupToko(); break;
    case 'tutuptokook': tutupTokoOk(); break;
    case 'saveconn': saveConn(); break;
    case 'saveopt': S.latihan = $('sLat').checked; S.printer = $('sPrn').checked; S.autoPrint = $('sAuto').checked; save('settings', S); toast('Tersimpan'); render(); break;
    case 'kunci': aturOpen = false; ui.tab = 'kasir'; render(); break;
    case 'syncnow': if(S.url){ if(ui.syncState==='gagal' && ui.syncErr) toast('Belum terkirim: '+ui.syncErr); syncNow(); } break;
    case 'pinok': pinOk(); break;
    case 'tutupatur': ui.forceAtur = false; ui.tab = 'kasir'; aturOpen = false; render(); break;
    case 'pincancel': var cc = pinCancel; closeSheet(); cc && cc(); break;
    case 'setoutlet': S.outlet = v; S.url = ($('suUrl')||{}).value||S.url; S.key = ($('suKey')||{}).value||S.key; renderSetup(); break;
    case 'setupok':
      S.url = $('suUrl').value.trim(); S.key = $('suKey').value.trim(); S.setupDone = true; save('settings', S);
      if(S.url){ toast('Mengambil menu…'); fetchConfig(function(ok, err){ toast(ok?'Terhubung ✓':'Belum terhubung: '+err+'. Bisa diatur nanti.'); render(); }); }
      render(); break;
  }
});


/* =================== MULAI =================== */
render();
if(S.url){ lastTry = Date.now(); fetchConfig(function(ok){ if(ok && !document.querySelector('.sheet-bg')) render(); }); syncNow(); }
if('serviceWorker' in navigator && location.protocol === 'https:'){
  try{ navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
}
