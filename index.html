<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F4EE">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<meta name="mobile-web-app-capable" content="yes">
<title>Kasir Lekker Victory</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --coklat:#1F1A17; --coklat2:#5E5047; --mentega:#FFB648; --krem:#FFFCF7; --krem2:#F5EEE4;
  --teks:#1F1A17; --abu:#9A8A7A; --garis:#EEE3D3; --hijau:#1E9E62; --merah:#D64545; --oranye:#E8912D; --sel:#FFF1DC;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--latar);color:var(--teks);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
header{position:sticky;top:0;z-index:20;background:var(--latar);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
header .logo{width:38px;height:38px;flex:none}
header .logo svg{width:38px;height:38px;display:block}
header .brand{flex:1;min-width:0}
header .brand small{display:block;color:var(--abu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .brand b{display:block;font-size:18px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:38px;height:38px;border-radius:50%;background:var(--putih);border:1px solid var(--garis);display:flex;align-items:center;justify-content:center;flex:none}
.pill{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--putih);border:1px solid var(--garis);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--abu);display:inline-block}
.pill.ok i{background:#34C27A}.pill.antre i{background:var(--oranye)}.pill.off{color:var(--merah)}.pill.off i{background:var(--merah)}.pill.demo i{background:#B9AC9F}
.latihan{background:var(--mentega);color:var(--teks);text-align:center;font-weight:700;font-size:13px;padding:5px}
main{padding:6px 14px 210px;max-width:720px;margin:0 auto}
.card{background:var(--putih);border:1px solid var(--garis);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--teks);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 span{font-weight:500;color:var(--abu);font-size:12.5px;text-align:right}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.ch b{font-size:15px}.ch span{font-size:12.5px;color:var(--abu)}
.omzet{background:var(--sel);border-radius:var(--r);padding:12px 12px 12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.omzet small{display:block;font-size:12px;color:var(--coklat2)}
.omzet b{display:block;font-size:20px;letter-spacing:.5px}
.eye{width:40px;height:40px;border-radius:50%;background:var(--putih);display:flex;align-items:center;justify-content:center}
.seg{display:flex;background:var(--krem2);border-radius:999px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px 6px;border-radius:999px;font-weight:600;font-size:14px;color:var(--coklat2)}
.seg button.on{background:var(--putih);color:var(--teks);box-shadow:0 1px 3px rgba(60,40,20,.12)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tp{position:relative;min-height:74px;border-radius:18px;border:2px solid transparent;font-weight:600;font-size:13.5px;padding:10px 2px 8px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:6px}
.tp .dot{width:28px;height:28px;border-radius:50%;display:block}
.tp:active{transform:scale(.96)}
.tp.sel{border-color:var(--teks)}
.tp .badge{position:absolute;top:4px;right:5px;background:var(--teks);color:var(--balik);border-radius:999px;font-size:11.5px;min-width:19px;line-height:19px;padding:0 4px;font-weight:700}
.tp small{font-size:10.5px;color:var(--oranye);font-weight:700}
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;margin-bottom:10px;align-items:center}
.slot{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:13.5px;font-weight:600}
.slot i{width:12px;height:12px;border-radius:50%;display:inline-block}
.slot em{font-style:normal;color:var(--abu);margin-left:2px}
.racikbox{margin-top:12px;border:1px solid var(--garis);border-radius:18px;padding:12px}
.racikbox small{display:block}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.fchip{flex:none;background:var(--putih);border:1px solid var(--garis);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;white-space:nowrap}
.fchip small{color:var(--abu);font-weight:500;margin-left:4px}
.sec{font-size:13px;font-weight:700;color:var(--coklat2);margin:4px 2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--teks);color:var(--balik);border-radius:999px;padding:6px 10px 6px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip i{font-style:normal;opacity:.75;font-size:13px}
.hint{color:var(--abu);font-size:13.5px;margin:4px 0}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.harga{font-weight:700;font-size:15px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:50%;background:var(--krem2);font-size:20px;font-weight:700;color:var(--teks)}
.step button:last-child{background:var(--teks);color:var(--balik)}
.step span{min-width:28px;text-align:center;font-weight:700;font-size:17px}
.mini{padding:8px 12px;border-radius:999px;background:var(--krem2);font-weight:600;font-size:13.5px;color:var(--coklat2)}
.btn{display:block;width:100%;padding:14px;border-radius:999px;background:var(--teks);color:var(--balik);font-weight:700;font-size:16px;text-align:center}
.btn:disabled{opacity:.35}
.btn.alt{background:var(--krem2);color:var(--teks)}
.btn.kuning{background:var(--mentega);color:var(--teks)}
.btn.merah{background:var(--merah)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.qb{flex:1 1 calc(50% - 8px);min-height:54px;text-align:left;padding:10px 14px;border-radius:18px;background:var(--putih);border:1px solid var(--garis)}
.qb b{display:block;font-size:14.5px}.qb small{color:var(--abu);font-size:12.5px}
.qb:disabled{opacity:.4}
.cartbar{position:fixed;left:0;right:0;bottom:66px;z-index:25;padding:0 14px 8px}
.cartbar .in{max-width:692px;margin:0 auto;background:var(--bar);color:#FFFFFF;border-radius:999px;display:flex;align-items:center;padding:6px 6px 6px 20px;gap:10px;box-shadow:0 8px 24px rgba(31,26,23,.28)}
.cartbar .info{flex:1;font-size:12.5px;color:#C9BBAA}.cartbar .info b{display:block;font-size:18px;color:#FFFFFF}
.cartbar .bayar{background:var(--mentega);color:var(--teks);font-weight:800;padding:13px 22px;border-radius:999px;font-size:16px}
.cartbar .bayar.tambah{background:#FFFFFF;padding:13px 18px;font-size:15.5px;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--putih);border-top:1px solid var(--garis);display:flex;padding:4px 0 env(safe-area-inset-bottom)}
nav button{flex:1;padding:7px 2px 8px;font-size:11.5px;color:var(--abu2);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--teks)}
nav.own{overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
nav.own button{flex:0 0 auto;min-width:66px;padding:7px 8px 8px}
.onlbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#E8F6EE;border:1.5px solid #3AA76D;color:#1F5F3C;border-radius:16px;padding:12px 14px;margin:0 0 12px;font-weight:700}
.onlbar.baru{animation:kedip 1s infinite}
@keyframes kedip{50%{background:#C8EED8}}
.coret{text-decoration:line-through;opacity:.55}
.sheet-bg{position:fixed;inset:0;background:rgba(31,26,23,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--putih);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:19px}
.line{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--krem2)}
.line .nm{flex:1;min-width:0}.line .nm b{display:block;font-size:15px}.line .nm small{color:var(--abu);font-size:13px}
.x{width:36px;height:36px;border-radius:50%;background:#FBE4E1;color:var(--merah);font-weight:800}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:12px 0}
.big{font-size:34px;font-weight:800;text-align:center;margin:6px 0}
label.f{display:block;font-size:13px;color:var(--abu);margin:12px 0 5px;font-weight:600}
.inp{width:100%;padding:13px 14px;border:1.5px solid var(--garis);border-radius:16px;background:var(--krem);font-size:16px}
.inp:focus{outline:none;border-color:var(--teks)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--krem2);font-size:15px;gap:10px}
.kv b{font-weight:700;text-align:right}
.muted{color:var(--abu);font-size:13px}
.tag{font-size:11.5px;padding:3px 8px;border-radius:999px;font-weight:700;background:var(--krem2);color:var(--coklat2)}
.tag.batal{background:#FBE4E1;color:var(--merah)}.tag.lat{background:#FFF1C2;color:#7a5a00}.tag.ok{background:#E2F2E8;color:var(--hijau)}
.bar{height:8px;background:var(--krem2);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--mentega)}
.toast{pointer-events:none;position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--teks);color:var(--balik);padding:10px 18px;border-radius:999px;z-index:60;font-size:14.5px;font-weight:600;max-width:90vw;text-align:center}
.ok-ic{width:72px;height:72px;border-radius:50%;background:#E2F2E8;color:var(--hijau);font-size:40px;display:flex;align-items:center;justify-content:center;margin:6px auto}
.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--krem2);gap:10px}
.sw input{width:22px;height:22px;accent-color:var(--teks);flex:none}
.setup{max-width:480px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 16px 24px}
.setup h1{color:var(--teks);font-size:24px;margin:8px 0 4px}
.setup .logo svg{width:64px;height:64px;display:block;margin:6px 0}
.optbtn{display:block;width:100%;text-align:left;padding:14px;border-radius:18px;border:1.5px solid var(--garis);background:var(--putih);margin-bottom:10px}
.optbtn.on{border-color:var(--teks);background:var(--sel)}
/* ===== v3.8 Mode Pemilik (hanya berlaku saat Mode Pemilik terbuka: body.lv-own) ===== */
body.lv-own header.ownh{background:var(--latar)}
body.lv-own header.ownh .brand small{font-size:12px}
body.lv-own header.ownh .brand b{font-size:20px;letter-spacing:-.3px}
main.ownm{padding-bottom:112px}
body.lv-own .card{border:1px solid var(--garis)}
.ctr{text-align:center}
.demobar{background:#FFF1C2;color:#6b5200;border-radius:14px;padding:9px 12px;font-size:12.5px;margin-bottom:12px}
/* navigasi 5 tab */
nav.own5{display:grid;grid-template-columns:repeat(5,1fr);background:var(--putih)}
nav.own5 button{padding:6px 0 8px;font-size:11px}
nav.own5 .ni{position:relative;display:flex;align-items:center;justify-content:center;width:52px;height:28px;border-radius:999px;transition:background .2s}
nav.own5 button.on .ni{background:var(--sel)}
nav.own5 .ni em{position:absolute;top:-3px;right:4px;background:var(--merah);color:#fff;font-style:normal;font-size:10px;font-weight:800;min-width:17px;height:17px;line-height:17px;border-radius:999px;padding:0 4px;border:2px solid var(--putih)}
/* animasi ringan */
.anim-in{animation:lvIn .22s ease-out}
.anim-l{animation:lvL .24s ease-out}
.anim-r{animation:lvR .24s ease-out}
@keyframes lvIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes lvL{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes lvR{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes lvUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes lvBg{from{background:rgba(31,26,23,0)}}
.skel{background:linear-gradient(90deg,#F1E8DC 25%,#FAF5EE 37%,#F1E8DC 63%);background-size:400% 100%;animation:lvSk 1.3s ease infinite;border-radius:10px}
@keyframes lvSk{0%{background-position:100% 50%}100%{background-position:0 50%}}
/* beranda */
.hero{background:linear-gradient(150deg,var(--hero1),var(--hero2) 60%);color:#FFFFFF;border-radius:24px;padding:14px 16px 16px;margin-bottom:12px;box-shadow:0 10px 26px rgba(31,26,23,.22)}
.hero small{color:#CDBFAF;font-size:12.5px}
.hero .hbig{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:2px 0}
.hero .hsub{color:#E5D9CB;font-size:13px}
.hseg{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;margin-bottom:12px}
.hseg button{flex:1;padding:7px 4px;border-radius:999px;font-size:13px;font-weight:600;color:#CDBFAF}
.hseg button.on{background:var(--mentega);color:var(--teks)}
.otiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:12px}
.otiles div{background:rgba(255,255,255,.07);border-radius:14px;padding:9px 10px}
.otiles span{display:flex;align-items:center;gap:6px;font-size:12px;color:#E5D9CB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.otiles i{width:8px;height:8px;border-radius:50%;flex:none}
.otiles b{display:block;font-size:16px;margin-top:2px}.otiles small{font-size:11.5px}
.sec2{font-size:13px;font-weight:700;color:var(--coklat2);margin:16px 4px 8px;display:flex;align-items:center;gap:6px}
.sec2 .cnt{background:var(--oranye);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.card.list0{padding:4px 0}
.list0 .lh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 4px}.list0 .lh span{color:var(--abu);font-size:12.5px}
.todo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--krem2)}
.todo:last-child{border-bottom:0}
.todo:active{background:var(--krem)}
.todo .tx{flex:1;min-width:0}.todo .tx b{display:block;font-size:14.5px}.todo .tx small{display:block;color:var(--abu);font-size:12.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.todo > svg.i{width:18px;height:18px;color:#C4B5A4;flex:none}
.tic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.tic svg.i{width:20px;height:20px}
.tic.or{background:#FDEBD3;color:#B8650F}.tic.hi{background:#E2F2E8;color:var(--hijau)}.tic.me{background:#FBE4E1;color:var(--merah)}
.tic.bi{background:#E3EEFB;color:#1c5cab}.tic.un{background:#EFEAFB;color:#5843c4}.tic.ab{background:var(--krem2);color:var(--coklat2)}
.card.calm{display:flex;gap:12px;align-items:center}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qgrid button{background:var(--putih);border:1px solid var(--garis);border-radius:18px;padding:12px;text-align:left;display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(60,40,20,.04)}
.qgrid button svg.i{width:22px;height:22px;color:#B8650F;background:#FFF1DC;border-radius:10px;padding:5px;box-sizing:content-box}
.qgrid b{font-size:14px}
.qgrid button:active,.todo:active,.lapchips button:active{transform:scale(.98)}
.dbadge{width:42px;flex:none;text-align:center;border-radius:12px;background:var(--krem2);padding:5px 0}
.dbadge b{display:block;font-size:17px;line-height:1.1}.dbadge small{display:block;font-size:10.5px;color:var(--coklat2);font-weight:700;text-transform:uppercase}
.amt{text-align:right;flex:none}.amt b{display:block;font-size:14.5px}.amt small{font-size:12px}
.or{color:#B8650F}.okc{color:var(--hijau)}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--coklat2);padding:4px 2px 10px;font-size:14.5px}
.back svg.i{width:18px;height:18px}
/* target */
.tgt .big3{font-size:26px;font-weight:800;letter-spacing:-.4px;margin:2px 0 8px}
.prog{position:relative;height:10px;background:var(--krem2);border-radius:6px}
.prog i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#FFB648,#F09A2A)}
.prog u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--teks);border-radius:1px;text-decoration:none}
/* pesanan */
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini.on{background:var(--teks);color:var(--balik)}
.qtybox{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:10px 12px;background:var(--krem);border-radius:16px}
.qtybox b{display:block;font-size:14.5px}.qtybox small{color:var(--abu);font-size:12px}
.step .qin{width:58px;padding:8px 4px;text-align:center;font-weight:700;font-size:17px;border-radius:12px;background:var(--putih)}
.step.sm button{width:32px;height:32px;font-size:17px}
.step.sm span{min-width:24px;font-size:15px}
.step.sm .qin{width:52px;padding:6px 2px;font-size:15px}
.laris{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.laris button{background:var(--putih);border:1.5px solid var(--garis);border-radius:16px;padding:9px 10px;text-align:left;font-weight:700;font-size:13.5px;line-height:1.2}
.laris button:active{background:var(--sel);border-color:var(--mentega)}
.laris .dots{display:flex;gap:3px;margin-bottom:5px}.laris .dots i{width:10px;height:10px;border-radius:50%}
.laris small{display:block;color:var(--abu);font-weight:600;font-size:12px;margin-top:2px}
.isi{margin-top:12px;border-top:1px solid var(--krem2)}
.isirow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--krem2)}
.isirow .nm{flex:1;min-width:0}.isirow .nm b{display:block;font-size:14.5px}.isirow .nm small{color:var(--abu);font-size:12.5px}
.isirow .x{width:32px;height:32px}
.pkl{display:grid;gap:6px}
.pkl button{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-radius:14px;border:1.5px solid var(--garis);background:var(--putih);text-align:left}
.pkl button.on{border-color:var(--teks);background:var(--sel)}
.pkl small{color:var(--coklat2);font-weight:700}
.toplist{border:1px solid var(--garis);border-radius:16px;padding:2px 10px}
.toprow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--krem2)}
.toprow:last-child{border-bottom:0}
.toprow span{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px}.toprow i{width:12px;height:12px;border-radius:50%}
.totbox{background:var(--krem);border-radius:16px;padding:4px 12px;margin-top:14px}
.seg.st5{margin:0 0 6px}.seg.st5 button{font-size:12.5px;padding:9px 2px}
details summary{list-style:none}details summary::-webkit-details-marker{display:none}
details summary::before{content:'＋ '}details[open] summary::before{content:'－ '}
/* laporan */

function parseIsi(txt){
  var out = [];

    part = part.trim(); if(!part) return;
    var m = part.match(/^(.*?)(?:\s*[x×]\s*(\d+))?$/i), n = (m && m[2]) ? Number(m[2]) : 1;

function allMembers(){ var ids = {}, out = [];

  localMembers.forEach(function(m){ if(!ids[m.id]) out.push(m); });
  return out; }
function ultahHadiah(m){
  var ms = cfg.member||{}; if(!m || !ms.hadiahNilai) return null;
  var p = String(m.lahir||'').split('-'); if(p.length<2 || !Number(p[0]) || !Number(p[1])) return null;
  var now = new Date(), t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()), hari = Number(ms.hadiahHari)||0;
  for(var y = now.getFullYear(); y >= now.getFullYear()-1; y--){
    var b = new Date(y, Number(p[1])-1, Number(p[0])), d = Math.round((t0 - b)/86400000);
    if(d >= 0 && d <= hari){
      var pakai = String(m.hadiah||'') === String(y) || txLog.some(function(t){ return t.member===m.id && String(t.hadiahUltah||'')===String(y) && t.status!=='Batal'; });
      return pakai ? null : {tahun:String(y), nilai:Number(ms.hadiahNilai)||0, isi:ms.hadiahIsi||'Hadiah ulang tahun'};
    }
  }
  return null;
}
function memberById(id){ var a = allMembers(); for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function saldoMember(id){
  var m = memberById(id); var s = m ? (Number(m.saldo)||0) : 0;
  queue.forEach(function(q){ if(q.type==='tx' && q.member===id && q.status==='OK') s += (q.poinPlus||0) - (q.poinMinus||0); });

}
function kanalDapatPoin(k){ var l = (cfg.member && cfg.member.kanal) || []; return !isGrab(k) && (l.indexOf(k) >= 0 || !l.length); }
function poinDari(total){ var per = (cfg.member && cfg.member.perRp) || 1000; return Math.floor(Math.max(0,total) / per); }

function cariMember(q){

    if(dig.length >= 3 && String(m.wa||'').replace(/\D/g,'').slice(-dig.length)===dig) return true;

var ingat = load('ingat', {});
function sekali(key){ if(ingat[key]) return false; ingat[key] = Date.now(); var batas = Date.now()-3*86400000; Object.keys(ingat).forEach(function(k){ if(ingat[k] < batas) delete ingat[k]; }); save('ingat', ingat); return true; }
function menitDari(hhmm){ var p = String(hhmm||'').split(':'); return p.length<2 ? null : Number(p[0])*60 + Number(p[1]); }
function cekPengingat(){
  var now = new Date(), m = now.getHours()*60 + now.getMinutes(), hari = dKey(now);
  if(shift && shift.jadwalSelesai){
    var akhir = menitDari(shift.jadwalSelesai), terakhir = Math.max.apply(null, (cfg.jadwal||[]).map(function(j){ return menitDari(j.selesai)||0; }));
    var tutupan = akhir !== null && akhir >= terakhir;
    if(akhir !== null && m >= akhir-15 && m < akhir && sekali('s15|'+shift.id)){ beep(2,'shift'); toast('15 menit lagi '+(tutupan?'jam tutup toko':'shift selesai')+'. Siapkan hitung laci.'); }
    if(akhir !== null && m >= akhir && m < akhir+60 && sekali('s0|'+shift.id)){ beep(3,'shift'); toast(tutupan ? 'Sudah jam tutup toko. Jangan lupa Tutup toko di menu Shift.' : 'Shift sudah selesai. Lakukan serah terima di menu Shift.'); }
  }
  if(queue.length){
    var tua = queue.reduce(function(a,q){ var t = new Date(q.time||Date.now()).getTime(); return Math.min(a, t); }, Date.now());
    if(Date.now()-tua > 30*60000 && sekali('off|'+hari+'|'+Math.floor(Date.now()/(30*60000)))){ beep(2,'offline'); toast('Ada data belum terkirim lebih dari 30 menit. Cek sinyal / internet.'); }
  }
}

/* ---------- PESANAN ONLINE di HP kasir (v3.6) ---------- */
var onl = {list: load('onllist', []), alarm:null};
function onlAktif(){ return onl.list.filter(function(o){ return o.status!=='Selesai' && o.status!=='Dibatalkan'; }); }
function onlBaru(){ return onl.list.filter(function(o){ return o.status==='Baru'; }); }
function cekOnline(){
  if(!S.url || !shift || S.latihan) return;
  fetch(S.url + (S.url.indexOf('?')<0?'?':'&') + 'action=online&key=' + encodeURIComponent(S.key) + '&outlet=' + encodeURIComponent(S.outlet), {method:'GET', redirect:'follow'})
    .then(function(r){ return r.json(); }).then(function(j){
      if(!j.ok) return;
      var lokal = {}; onl.list.forEach(function(o){ lokal[o.id] = o; });
      var baru = false;
      onl.list = (j.online||[]).map(function(o){
        var l = lokal[o.id];
        if(l && l.lokal && rankStat(l.status) > rankStat(o.status)) o.status = l.status;
        if(!l && o.status==='Baru') baru = true;
        return o;
      });
      save('onllist', onl.list);
      if(baru) mulaiAlarm();
      if(!document.querySelector('.sheet-bg')) render();
    }).catch(function(){});
}
function rankStat(s){ return {'Baru':0,'Diproses':1,'Siap':2,'Selesai':3,'Dibatalkan':3}[s]||0; }
/* v3.7: suara khas + bacakan pesanan, berulang sampai dibuka */
function mulaiAlarm(){ if(!bunyiOn('online') || onl.alarm) return; onl.alarm = true; siklusAlarm(); }
function siklusAlarm(){
  if(!onl.alarm) return;
  if(!onlBaru().length){ stopAlarm(); return; }
  var nama = suaraOnl();
  putarSuara(nama, function(dur){
    onl.tm = setTimeout(function(){
      if(!onl.alarm) return;
      var lanjut = function(){ if(onl.alarm) onl.tm = setTimeout(siklusAlarm, 4000); };
      if(S.bacakan !== false) bacakan(onlBaru().map(function(o){ return teksOnl(o, nama==='dani'); }).join(' '), lanjut); else lanjut();
    }, Math.max(0.3, dur - 0.5) * 1000);
  });
}
function stopAlarm(){ onl.alarm = null; if(onl.tm){ clearTimeout(onl.tm); onl.tm = null; } try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
setInterval(cekOnline, 60000);

var KOREKSI_OK = {'Disetujui':1, 'Oleh pemilik':1, 'Langsung (PIN pemilik)':1};
function applyKoreksi(list){
  if(!list || !list.length) return;
  var ubah = false;
  list.forEach(function(k){
    var t = txById(k.tx); if(!t) return;
    if(t.minta && t.minta.id===k.id && t.minta.status!==k.status){ var dulu = t.minta.status; t.minta.status = k.status; ubah = true;
      if(dulu==='Menunggu'){ beep(2,'koreksi'); toast('Ajuan '+(t.minta.aksi==='batal'?'pembatalan':'ubah bayar')+' '+(KOREKSI_OK[k.status]?'disetujui':'ditolak')+' pemilik'); } }
    if(!KOREKSI_OK[k.status]) return;
    if(k.aksi==='batal' && t.status!=='Batal'){ t.status = 'Batal'; t.alasan = k.alasan||'Disetujui pemilik'; ubah = true; }
    if(k.aksi==='bayar' && k.baru && t.bayar!==k.baru && t.status!=='Batal'){ if(!t.bayarAsal) t.bayarAsal = t.bayar; t.bayar = k.baru; if(t.bayarAsal===k.baru) delete t.bayarAsal; ubah = true; }
  });
  if(ubah){ save('txlog', txLog); if(!document.querySelector('.sheet-bg')) render(); }
}
function adaMenunggu(){ return txLog.some(function(t){ return t.minta && t.minta.status==='Menunggu' && t.status!=='Batal'; }); }
function cekKoreksi(){
  if(!S.url || !adaMenunggu()) return;
  fetch(S.url + (S.url.indexOf('?')<0?'?':'&') + 'action=koreksi&key=' + encodeURIComponent(S.key), {method:'GET', redirect:'follow'})
    .then(function(r){ return r.json(); }).then(function(j){ if(j.ok) applyKoreksi(j.koreksi); }).catch(function(){});
}

/* ---------- REKAP (HP ini) ---------- */
function viewRekap(){
  var now = new Date(), from, to = dKey(now), label;
  if(ui.rekap==='kemarin'){ var y = new Date(now.getTime()-86400000); from = to = dKey(y); }
  else if(ui.rekap==='7'){ from = dKey(new Date(now.getTime()-6*86400000)); }
  else from = to;
  var list = txLog.filter(function(t){
    if(t.status==='Batal') return false;
    if(ui.rekap==='shift') return t.shiftId===shift.id;
    var k = dKey(t.time); return k>=from && k<=to;
  });
  var tot=0, pcs=0, perK={}, perB={}, perL={}, perT={}, perC={};
  list.forEach(function(t){
    tot += t.total; pcs += t.pcs;
    perK[t.kanal] = (perK[t.kanal]||0)+t.total; perB[t.bayar] = (perB[t.bayar]||0)+t.total;
    t.items.forEach(function(i){
      if(i.jenis==='Potongan') return;
      var lv = i.jenis==='Paket' ? 'Paket' : i.nTop+' topping'; perL[lv] = (perL[lv]||0)+i.pcs;
      if(i.jenis!=='Paket') perC[i.nama] = (perC[i.nama]||0)+i.qty;
      (i.toppings||[]).forEach(function(x){ perT[x.nama] = (perT[x.nama]||0)+x.jumlah; });
    });
  });
  var h = '<div class="seg">'+[['hari','Hari ini'],['kemarin','Kemarin'],['7','7 hari'],['shift','Shift ini']].map(function(o){ return '<button data-a="rekap" data-v="'+o[0]+'" class="'+(ui.rekap===o[0]?'on':'')+'">'+o[1]+'</button>'; }).join('')+'</div>';
  h += '<div class="card"><h3>Ringkasan <span>'+esc(S.outlet)+' · HP ini</span></h3>'+
    '<div class="kv"><span>Omzet</span><b>'+rp(tot)+'</b></div><div class="kv"><span>Transaksi</span><b>'+list.length+'</b></div><div class="kv"><span>Total pcs</span><b>'+num(pcs)+'</b></div>'+
    '<div class="kv"><span>Rata-rata per transaksi</span><b>'+rp(list.length?tot/list.length:0)+'</b></div></div>';
  function block(title, obj, fmt, sortVal){
    var keys = Object.keys(obj); if(!keys.length) return '';
    keys.sort(function(a,b){ return sortVal ? obj[b]-obj[a] : a.localeCompare(b,'id',{numeric:true}); });
    var max = Math.max.apply(null, keys.map(function(k){ return obj[k]; })) || 1;
    return '<div class="card"><h3>'+title+'</h3>'+keys.map(function(k){ return '<div style="padding:6px 0"><div class="row between"><span>'+esc(k)+'</span><b>'+fmt(obj[k])+'</b></div><div class="bar"><i style="width:'+(obj[k]/max*100)+'%"></i></div></div>'; }).join('')+'</div>';
  }
  h += block('Per kanal', perK, rp, true) + block('Per pembayaran', perB, rp, true) + block('Pcs per jumlah topping', perL, function(v){ return num(v)+' pcs'; }, false);
  h += block('Pemakaian topping (porsi)', perT, function(v){ return num(v); }, true);
  var top = {}; Object.keys(perC).sort(function(a,b){ return perC[b]-perC[a]; }).slice(0,5).forEach(function(k){ top[k] = perC[k]; });
  h += block('5 kombinasi terlaris (pcs)', top, function(v){ return num(v); }, true);
  if(!list.length) h += kosong('Belum ada data di periode ini.');
  h += '<p class="muted" style="text-align:center">Rekap semua outlet & HP: Google Sheet, tab "Rekap Kasir".</p>';
  return h;
}

function ulangTahunMinggu(){
  var now = new Date(), t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()), out = [];
  allMembers().forEach(function(m){
    var p = String(m.lahir||'').split('-'); if(p.length<2) return;
    var d = new Date(now.getFullYear(), Number(p[1])-1, Number(p[0])); if(d < t0) d = new Date(now.getFullYear()+1, Number(p[1])-1, Number(p[0]));
    var diff = Math.round((d - t0)/86400000); if(diff>=0 && diff<=7) out.push({m:m, d:diff});
  });
  return out.sort(function(a,b){ return a.d-b.d; });
}

function karyawanAktif(){
  var k = (cfg.karyawan && cfg.karyawan.length) ? cfg.karyawan : (cfg.kasir||[]).map(function(n){ return {nama:n, pin:'', peran:'Pemilik', aktif:true}; });
  k = k.filter(function(x){ return x.aktif; });
  return k.length ? k : [{nama:'Kasir', pin:'', peran:'Karyawan', aktif:true}];
}
function menitDari(hhmm){ var p = String(hhmm||'0:0').split(':'); return Number(p[0])*60 + Number(p[1]||0); }
function menitSekarang(d){ d = d||new Date(); return d.getHours()*60 + d.getMinutes(); }
function tebakShift(){
  var j = cfg.jadwal||[]; if(!j.length) return null;
  var now = menitSekarang(), best = null, bd = 1e9;
  j.forEach(function(x){ var d = Math.abs(now - menitDari(x.mulai)); if(now > menitDari(x.selesai)) d += 600; if(d < bd){ bd = d; best = x; } });

function fetchOwnOnline(diam){
  var t = ui.own.onl || (ui.own.onl = {});
  if(!S.url){ if(!t.list) t.list = demoOnline(); t.done = true; if(bolehRender()) render(); return; }
  fetch(S.url + (S.url.indexOf('?')<0?'?':'&') + 'action=owner&sub=online&key=' + encodeURIComponent(S.key) + '&pin=' + encodeURIComponent(cfg.pin||''), {method:'GET', redirect:'follow'})
    .then(function(r){ return r.json(); }).then(function(j){
      if(!j.ok) return;
      var dulu = {}; (t.list||[]).forEach(function(x){ dulu[x.id] = x.status; });
      var berubah = (j.online||[]).some(function(x){ return t.list && dulu[x.id] && dulu[x.id]!==x.status && (x.status==='Siap' || x.status==='Selesai' || x.status==='Dibatalkan'); });
      t.list = j.online || []; t.done = true;
      if(berubah){ beep(2,'pemilik'); toast('Status pesanan online berubah'); }
      if(!document.querySelector('.sheet-bg') && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) render();
    }).catch(function(){});
}

function simpanIsiKiriman(){ var keep = []; for(var q=0;q<ui.kir.lines;q++) keep.push([($('kb'+q)||{}).value, ($('kj'+q)||{}).value]); ui.kir.isi = keep; ui.kir.tgl = ($('kTgl')||{}).value || ui.kir.tgl; ui.kir.kode = ($('kKode')||{}).value || ui.kir.kode; }

function kirimanOk(){
  var k = ui.kir, recs = [], bad = false, ke = k.pemilik ? k.ke : S.outlet, dari = k.pemilik ? k.dari : (k.asal || 'Gudang'), oleh = k.pemilik ? ($('kOleh')||{}).value : (shift?shift.kasir:'');
  var tgl = k.pemilik ? (($('kTgl')||{}).value || tglKey(0)) : tglKey(0), kode = (k.pemilik && (ke==='Pesanan' || dari==='Pesanan')) ? (($('kKode')||{}).value||'') : '';
  if(dari===ke){ toast('Lokasi asal dan tujuan tidak boleh sama'); return; }
  for(var i=0;i<k.lines;i++){
    var b = ($('kb'+i)||{}).value, j = angkaDes(($('kj'+i)||{}).value);
    if(!b && j===null) continue;
    if(!b || j===null || isNaN(j) || j<=0){ bad = true; continue; }

    recs.push({type:'kiriman', uid:id, id:id, time:new Date().toISOString(), tanggal:tgl, ke:ke, dari:dari, kode:kode, bahan:b, jumlah:j, oleh:oleh, status:(!k.pemilik && S.latihan)?'Latihan':'OK'});
  }
  if(bad){ toast('Lengkapi bahan dan jumlahnya (desimal pakai koma)'); return; }
  if(!recs.length){ toast('Belum ada bahan yang diisi'); return; }
  queue = queue.concat(recs); save('queue', queue); k.lines = 3; closeSheet();

  var i = urut.indexOf(nm); return i>=0 && i<OUTLET_WARNA.length ? OUTLET_WARNA[i] : '#9A8A7A';

function nmOutlet(o){ return o==='Umum (bersama)' ? 'Pesanan acara' : o; }
function rpK(n){ n = Math.round(Number(n)||0); var a = Math.abs(n), s = n<0 ? '−' : '';
  if(a>=1e6) return s+'Rp'+String(Math.round(a/1e5)/10).replace('.',',')+' jt';
  if(a>=1e3) return s+'Rp'+Math.round(a/1e3)+' rb';
  return s+'Rp'+a; }
function angkaK(n){ n = Math.round(Number(n)||0); if(n>=1e6) return String(Math.round(n/1e5)/10).replace('.',',')+'jt'; if(n>=1e3) return Math.round(n/1e3)+'rb'; return String(n); }

/* ---- Navigasi ---- */
function ownGo(tab, sub, simpan){
  var o = ui.own, lama = o.tab;
  if(!simpan) o.stack = [];
  o.tab = tab;
  if(tab==='pesanan' && sub) o.psub = sub;
  if(tab==='stok') o.ssub = sub || (lama==='stok' ? o.ssub : 'stok');
  if(tab==='lap' && sub) o.lap = sub;
  if(tab==='lain') o.lsub = sub || null;
  o.anim = 'in'; render(); try{ window.scrollTo(0,0); }catch(e){}
  ownMuat();
}
function ownMuat(){
  var o = ui.own;
  if(!o.data && !o.loading) fetchOwner();
  if((o.tab==='lap' || o.tab==='home') && (!o.dash || Date.now()-(o.dashAt||0) > 300000) && !o.dashLoading) fetchDash(false, !!o.dash);
  if(o.tab==='pesanan' && o.psub==='acara' && !o.acaraLoading && (!o.acara || Date.now()-(o.acaraAt||0) > 120000)) fetchAcara(!!o.acara);
  if(o.tab==='pesanan' || o.tab==='home'){ var t = o.onl || (o.onl = {}); if(!t.done && !t.tried){ t.tried = true; fetchOwnOnline(); } }
  if(o.tab==='lain' && o.lsub==='tutup' && !(o.tutup||{}).data) fetchTutup();
}
function ownBadges(){
  var d = ui.own.data || {}, kirim = ui.own.kirim || {};

  var onl = ((ui.own.onl||{}).list||[]).filter(function(x){ return x.status==='Siap' || x.status==='Baru'; }).length;

/* =================== STRUK (RawBT) =================== */
function struk(t){
  var W = 32, L = function(a,b){ a = String(a); b = String(b); var sp = W - a.length - b.length; return sp>0 ? a + Array(sp+1).join(' ') + b : a+'\n'+Array(W-b.length+1).join(' ')+b; };
  var C = function(s){ s = String(s); var p = Math.max(0, Math.floor((W - s.length)/2)); return Array(p+1).join(' ') + s; };
  var garis = Array(W+1).join('-');
  var s = [C('LEKKER VICTORY'), C(t.outlet), '', L(tglTampil(t.time)+' '+jam(t.time), t.kasir), L(t.kanal, t.id.slice(-11)), garis];
  t.items.forEach(function(i){ s.push(i.label||i.nama); if(i.label) s.push('  '+i.nama); s.push(L('  '+i.qty+' x '+num(i.harga), num(i.subtotal))); });
  s.push(garis); s.push(L('TOTAL', rp(t.total)));
  if(t.bayar==='Tunai'){ s.push(L('Tunai', rp(t.terima))); s.push(L('Kembali', rp(t.terima - t.total))); } else s.push(L('Bayar', t.bayar));
  if(t.member){ s.push(garis); s.push('Member: '+t.memberNama); s.push(L('Poin transaksi ini', '+'+(t.poinPlus||0)+(t.poinMinus?' -'+t.poinMinus:''))); if(t.saldoSesudah!=null) s.push(L('Saldo poin', num(t.saldoSesudah))); }
  if(t.status==='Batal') s.push(C('*** DIBATALKAN ***'));
  s.push(garis); s.push(C('Terima kasih!')); s.push(''); s.push(''); s.push('');
  return s.join('\n');
}
function printText(txt){
  var b64 = btoa(unescape(encodeURIComponent(txt)));
  window.location.href = 'intent:base64,' + b64 + '#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';
}
function printStruk(id){ var t = txById(id); if(t) printText(struk(t)); }
